{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Entrar</h1>
{% if form.errors %}<p class="aviso aviso-error" role="alert">Usuário ou senha incorretos. Tente novamente.</p>{% endif %}
<form method="post" class="formulario">
  {% csrf_token %}
  <fieldset>
    <legend>Dados de acesso</legend>
  <div class="campo"><label for="id_username">Usuário</label>{{ form.username }}</div>
  <div class="campo"><label for="id_password">Senha</label>{{ form.password }}</div>
  </fieldset>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
